name: Continuous Integration
on: [pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        zig-version: [0.14.1]
        include:
          # macOS builds
          - os: macos-latest
            arch: aarch64
          - os: macos-latest
            arch: x86_64
          # Linux builds
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: x86_64
          # Windows builds
          - os: windows-latest
            arch: x86_64
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{matrix.zig-version}}
      - name: Build
        run: zig build --summary all
      
